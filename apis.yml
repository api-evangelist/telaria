aid: telaria
name: Telaria
description: >-
  Telaria was an independent supply-side platform (SSP) for premium video and
  connected TV (CTV) advertising, formerly known as Tremor Video's sell-side
  business. Its Video Management Platform (VMP) combined an ad server built for
  advanced/OTT TV with real-time analytics, automated decisioning, yield
  optimization, and integrated programmatic plus direct-sold monetization for
  publishers of digital video inventory. On April 1, 2020 Telaria completed an
  all-stock merger of equals with Rubicon Project to form Magnite, now the
  largest independent sell-side advertising platform spanning CTV, desktop, and
  mobile. Telaria no longer operates as a standalone company: the telaria.com
  domain redirects to magnite.com, and the "Telaria" name survives publicly only
  as a Prebid.js header-bidding bidder adapter routed through Magnite. This
  profile documents the historical company; there is no independent public
  developer API, OpenAPI definition, SDK, or documentation portal to harvest.
